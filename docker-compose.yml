services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: ielts-server
    restart: unless-stopped
    ports:
      - "8787:8787"
    # Values come from a .env file next to this compose file (gitignored), e.g.:
    #   JWT_SECRET=<long random string>
    #   AI_API_KEY=sk-...
    #   AI_MODEL=glm-5.3
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AI_BASE_URL: ${AI_BASE_URL:-https://aiberm.org/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-glm-5.3}
      PORT: "8787"
      DB_PATH: "/data/ielts.db"
    volumes:
      - ielts-data:/data

  web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile.web
    image: ielts-web
    restart: unless-stopped
    ports:
      - "8081:8081"

volumes:
  ielts-data:
